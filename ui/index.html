<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="appTitle"></title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="widget" class="widget">
    <!-- Flyout Header (System Tray Hover Flyout — no window pin/close chrome) -->
    <header id="titlebar" class="titlebar">
      <div class="brand">
        <span class="status-dot" id="statusDot"></span>
        <div class="brand-text">
          <div class="brand-row">
            <span class="brand-title" data-i18n="brandTitle"></span>
            <span class="tier-badge" id="tierBadge">...</span>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="btnToggleMode" class="mode-pill" data-i18n-title="tooltips.toggleMode">
          <strong id="modeLabel"></strong>
        </button>
        <select id="langSelect" class="lang-select" data-i18n-title="tooltips.language"></select>
        <button id="btnInfoToggle" class="icon-btn" data-i18n-title="tabs.info">
          <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.2" fill="none">
            <circle cx="12" cy="12" r="9"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </button>
        <button id="btnRefresh" class="icon-btn" data-i18n-title="tooltips.refresh">
          <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.2" fill="none">
            <path d="M21 2v6h-6"></path>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M3 22v-6h6"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
          </svg>
        </button>
        <button id="btnQuit" class="icon-btn close-btn" data-i18n-title="tray.quit">
          <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.2" fill="none">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Full Flyout View -->
    <main id="fullView" class="full-view">
      <div id="errorBanner" class="error-banner hidden"></div>

      <!-- Unauthenticated / Prerequisite Card -->
      <section id="loginView" class="login-view hidden">
        <div class="login-card">
          <div id="loginTitle" class="login-title"></div>
          <p id="loginDesc" class="login-desc"></p>
          <button id="btnGoogleLogin" class="google-btn">
            <span id="loginBtnText"></span>
          </button>
        </div>
      </section>

      <!-- Authenticated Unified Flyout Dashboard -->
      <div id="authedContent" class="authed-content">
        <div id="dashboardView" class="dashboard-scroll">
          <!-- Hero Section: 5h & Weekly Quota Groups side-by-side -->
          <section id="tabSummary" class="dash-section">
            <div id="summaryList" class="quota-groups">
              <div class="skeleton" data-i18n="status.loading"></div>
            </div>
          </section>

          <!-- Per-Model Quotas Grid (directly visible in Flyout) -->
          <section id="tabModels" class="dash-section">
            <div class="section-header">
              <span class="section-label" data-i18n="tabs.models"></span>
              <span id="modelsCountBadge" class="models-count-badge"></span>
            </div>
            <div id="modelsList" class="models-grid"></div>
          </section>
        </div>

        <!-- Toggleable Info Drawer -->
        <section id="tabInfo" class="tab-content hidden">
          <div class="quota-list models-scroll">
            <div class="quota-card">
              <div class="card-title" data-i18n="info.connTitle"></div>
              <div class="card-sub info-block" id="infoSessionDetails"></div>
            </div>
            <div class="quota-card">
              <div class="card-title" data-i18n="info.aboutTitle"></div>
              <div class="card-sub info-block" data-i18n="info.aboutDesc"></div>
            </div>
            <div class="quota-card">
              <div class="card-title" data-i18n="info.repoTitle"></div>
              <div class="card-sub info-block">
                <div><strong data-i18n="info.authorLabel"></strong> sidequest-chain</div>
                <div><strong data-i18n="info.githubLabel"></strong> sidequest-chain/antigravity-quota-monitor</div>
                <div><strong data-i18n="info.licenseLabel"></strong> MIT (AS-IS)</div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer-left">
          <button id="btnSwitchAccount" class="account-btn">
            <span id="userEmail" class="email-text"></span>
            <span class="switch-hint">⇄</span>
          </button>
          <span class="sep">•</span>
          <span id="sessionsCount" class="sessions-badge" data-i18n-title="tooltips.sessions"></span>
        </div>
        <div class="footer-right">
          <input id="opacitySlider" type="range" min="45" max="100" value="92" data-i18n-title="tooltips.opacity" />
          <span id="updatedAt" class="time-text">--:--</span>
        </div>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
