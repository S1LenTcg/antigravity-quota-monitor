<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGY Taskbar Widget</title>
  <style>
    :root {
      --taskbar-bg: #24201e;
      --good: #34d399;
      --warn: #fbbf24;
      --danger: #fb7185;
      --cyan: #38bdf8;
      --indigo: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--taskbar-bg);
      font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, sans-serif;
      color: #f8fafc;
      overflow: hidden;
    }

    .pill-btn {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 8px;
      border-radius: 5px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .pill-btn:hover,
    body.flyout-open .pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.07);
    }

    .widget-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.22));
      border: 1px solid rgba(56, 189, 248, 0.32);
      transition: all 0.35s ease;
    }

    .widget-badge.weekly-mode {
      background: linear-gradient(135deg, rgba(129, 140, 248, 0.24), rgba(168, 85, 247, 0.22));
      border-color: rgba(129, 140, 248, 0.38);
    }

    .badge-mode-text {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: #7dd3fc;
      line-height: 1;
    }

    .widget-badge.weekly-mode .badge-mode-text {
      color: #c4b5fd;
    }

    .rows {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      transition: opacity 0.4s ease-in-out;
    }

    .rows.fading {
      opacity: 0.15;
    }

    .row-item {
      display: flex;
      flex-direction: column;
      gap: 1.5px;
    }

    .row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      line-height: 11px;
      height: 11px;
    }

    .model-name {
      font-size: 10.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.88);
      white-space: nowrap;
    }

    .model-pct {
      font-size: 10.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: var(--good);
    }

    .bar-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .fill-good {
      background: linear-gradient(90deg, #0ea5e9, #34d399);
    }

    .fill-warn {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
    }

    .fill-danger {
      background: linear-gradient(90deg, #e11d48, #fb7185);
    }
  </style>
</head>
<body>
  <div class="pill-btn" id="pillBtn">
    <div class="widget-badge" id="widgetBadge">
      <span class="badge-mode-text" id="badgeModeText">5h</span>
    </div>
    <div class="rows" id="pillRows">
      <div class="row-item">
        <div class="row-top">
          <span class="model-name" id="row1Label">Flash</span>
          <span class="model-pct" id="row1Pct">--%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill fill-good" id="row1Bar" style="width: 3%"></div>
        </div>
      </div>
      <div class="row-item">
        <div class="row-top">
          <span class="model-name" id="row2Label">Argon</span>
          <span class="model-pct" id="row2Pct">--%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill fill-good" id="row2Bar" style="width: 3%"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;

    let lastSnap = null;
    let showRemaining = true;
    let windowMode = "5h";

    const widgetBadge = document.getElementById("widgetBadge");
    const badgeModeText = document.getElementById("badgeModeText");
    const pillRows = document.getElementById("pillRows");
    const row1Pct = document.getElementById("row1Pct");
    const row1Bar = document.getElementById("row1Bar");
    const row2Pct = document.getElementById("row2Pct");
    const row2Bar = document.getElementById("row2Bar");
    const pillBtn = document.getElementById("pillBtn");

    function fillClass(rem) {
      if (rem <= 0.2) return "fill-danger";
      if (rem <= 0.5) return "fill-warn";
      return "fill-good";
    }

    function textCol(rem) {
      if (rem <= 0.2) return "#fb7185";
      if (rem <= 0.5) return "#fbbf24";
      return "#34d399";
    }

    function fmtPct(remPct, usedPct) {
      const v = showRemaining ? remPct : usedPct;
      return `${v.toFixed(1).replace(".0", "")}%`;
    }

    function findStat(snap, familyKey, idHint, mode) {
      if (!snap || !snap.authenticated) return null;
      const buckets = snap.buckets || [];
      if (mode === "weekly") {
        const wb =
          buckets.find((b) => b.id === "gemini-weekly") ||
          buckets.find((b) => b.groupKey === "gemini" && b.window === "weekly") ||
          buckets.find((b) => b.window === "weekly");
        if (wb) return wb;
      } else {
        const fb =
          buckets.find((b) => b.id === "gemini-5h") ||
          buckets.find((b) => b.groupKey === "gemini" && b.window === "5h");
        const models = snap.models || [];
        const matches = models.filter(
          (m) => m.familyKey === familyKey || (idHint && m.id.toLowerCase().includes(idHint))
        );
        if (matches.length > 0) {
          const mStat = matches.reduce((min, cur) =>
            cur.remainingFraction < min.remainingFraction ? cur : min
          );
          if (!fb || (typeof mStat.resetSeconds === "number" && mStat.resetSeconds <= 19800)) {
            return mStat;
          }
        }
        if (fb) return fb;
      }
      return buckets.find((b) => b.groupKey === "gemini") || null;
    }

    function applyRow(pctEl, barEl, stat) {
      if (!stat) {
        pctEl.textContent = "--%";
        pctEl.style.color = "#94a3b8";
        barEl.className = "bar-fill fill-good";
        barEl.style.width = "3%";
        return;
      }
      const w = showRemaining ? stat.remainingPercent : stat.usedPercent;
      pctEl.textContent = fmtPct(stat.remainingPercent, stat.usedPercent);
      pctEl.style.color = textCol(stat.remainingFraction);
      barEl.className = `bar-fill ${fillClass(stat.remainingFraction)}`;
      barEl.style.width = `${Math.max(3, w)}%`;
    }

    function renderPill() {
      const isWeekly = windowMode === "weekly";
      badgeModeText.textContent = isWeekly ? "Wk" : "5h";
      widgetBadge.classList.toggle("weekly-mode", isWeekly);

      const flashStat = findStat(lastSnap, "gemini_3_8_flash", "flash", windowMode);
      const argonStat = findStat(lastSnap, "gemini_4_argon", "argon", windowMode);
      applyRow(row1Pct, row1Bar, flashStat);
      applyRow(row2Pct, row2Bar, argonStat);
    }

    window.__onPillSync = function (snap, remMode, tbColor, flyoutOpen) {
      if (snap) lastSnap = snap;
      if (typeof remMode === "boolean") showRemaining = remMode;
      if (tbColor) {
        document.documentElement.style.setProperty("--taskbar-bg", tbColor);
      }
      if (typeof flyoutOpen === "boolean") {
        document.body.classList.toggle("flyout-open", flyoutOpen);
      }
      renderPill();
    };

    pillBtn.addEventListener("mousedown", (e) => {
      if (e.button === 0) {
        invoke("start_pill_drag").catch(() => {});
      }
    });

    async function initPill() {
      try {
        const st = await invoke("get_dock_state");
        if (st && st.taskbarColor) {
          document.documentElement.style.setProperty("--taskbar-bg", st.taskbarColor);
        }
      } catch (_) {}
      try {
        const snap = await invoke("get_usage");
        lastSnap = snap;
        renderPill();
      } catch (_) {}
    }

    initPill();

    // Calmly alternate between 5h and Wk every 10 seconds
    setInterval(() => {
      if (!lastSnap || !lastSnap.authenticated) return;
      pillRows.classList.add("fading");
      setTimeout(() => {
        windowMode = windowMode === "5h" ? "weekly" : "5h";
        renderPill();
        pillRows.classList.remove("fading");
      }, 380);
    }, 10000);
  </script>
</body>
</html>
