name: Build & Release (Windows x64)

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "locales/**"
      - "Cargo.toml"
      - "installer.nsi"
      - ".github/workflows/build.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows x64 Installer & Portable Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version and whether release already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $cargoToml = Get-Content "Cargo.toml" -Raw
          if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') {
            $rawVer = $Matches[1]
            $ver = "v" + $rawVer
          } else {
            $rawVer = "0.2.0"
            $ver = "v0.2.0"
          }
          "raw_version=$rawVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Target release version: $ver"

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -or "${{ github.ref }}" -like "refs/tags/v*") {
            "should_build=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Manual dispatch or explicit tag push -> proceeding with build."
            exit 0
          }

          # Check if a release with the compiled setup installer already exists for this version
          $assets = gh release view $ver --json assets --jq ".assets[].name" 2>$null
          if ($LASTEXITCODE -eq 0 -and ($assets -match "antigravity-quota-monitor-windows-x64-setup\.exe")) {
            "should_build=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Release $ver already has a built setup .exe asset. Skipping build (push a tag or use Run workflow to rebuild)."
          } else {
            "should_build=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Release $ver does not have a built setup .exe yet -> proceeding with build."
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Install Rust stable toolchain
        if: steps.check.outputs.should_build == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and target directory
        if: steps.check.outputs.should_build == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        if: steps.check.outputs.should_build == 'true'
        shell: pwsh
        env:
          RUSTFLAGS: "--remap-path-prefix ${{ github.workspace }}=/app -C link-arg=/PDBALTPATH:%_PDB%"
        run: |
          cargo build --release --locked

      - name: Package portable executable, NSIS installer, and checksums
        if: steps.check.outputs.should_build == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/antigravity-quota-monitor.exe" "dist/antigravity-quota-monitor-windows-x64.exe"

          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) {
              $makensis = $cmd.Source
            } else {
              Write-Host "Installing NSIS via Chocolatey..."
              choco install nsis -y --no-progress
              $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
            }
          }
          & $makensis "/DAPP_VERSION=${{ steps.check.outputs.raw_version }}" "installer.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installer compilation failed"
          }

          $lines = @()
          foreach ($file in @("antigravity-quota-monitor-windows-x64-setup.exe", "antigravity-quota-monitor-windows-x64.exe")) {
            $hash = (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $file"
          }
          $lines | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding utf8

      - name: Upload build artifacts
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-quota-monitor-windows-x64
          path: |
            dist/antigravity-quota-monitor-windows-x64-setup.exe
            dist/antigravity-quota-monitor-windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: "Antigravity Quota Monitor ${{ steps.check.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/antigravity-quota-monitor-windows-x64-setup.exe
            dist/antigravity-quota-monitor-windows-x64.exe
            dist/SHA256SUMS.txt
