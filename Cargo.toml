[package]
name = "antigravity-quota-monitor"
version = "0.3.0"
description = "Real-time Quota & Usage Monitor Widget for Google Antigravity CLI and IDE"
authors = ["sidequest-chain <162595533+sidequest-chain@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/sidequest-chain/antigravity-quota-monitor"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
